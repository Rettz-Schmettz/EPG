name: Build EPG

on:
  schedule:
    # 04:17 и 16:17 по Москве
    - cron: "17 1,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["channels.tsv", "aliases.json", "config.json", "build_epg.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh channel list from playlist (if PLAYLIST_URL secret is set)
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: |
          if [ -z "$PLAYLIST_URL" ]; then echo "PLAYLIST_URL не задан — беру channels.tsv из репозитория"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/pl"
          if curl -fsSL --retry 3 --max-time 120 -A "UniPlayer" -o "$RUNNER_TEMP/pl/playlist.m3u" "$PLAYLIST_URL" \
             && head -c 7 "$RUNNER_TEMP/pl/playlist.m3u" | grep -q "#EXTM3U"; then
            python extract_channels.py "$RUNNER_TEMP/pl/playlist.m3u" "$RUNNER_TEMP/pl/channels.tsv"
            cp "$RUNNER_TEMP/pl/channels.tsv" channels.tsv
            echo "Список каналов обновлён из плейлиста"
          else
            echo "::warning::Плейлист не скачался — беру channels.tsv из репозитория"
          fi
          rm -f "$RUNNER_TEMP/pl/playlist.m3u"
      - name: Build epg.xml.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build_epg.py --config config.json --out public
      - name: Summary
        if: always()
        run: test -f public/report.md && head -n 40 public/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save report to branch "report"
        if: always()
        run: |
          test -f public/report.md || exit 0
          cd public
          git init -q -b report
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add report.md sources
          git commit -q -m "report $(date -u +%F_%H%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" report
          rm -rf .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
