name: Build EPG

on:
  schedule:
    # 04:17 и 16:17 по Москве
    - cron: "17 1,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["channels.tsv", "aliases.json", "config.json", "build_epg.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build epg.xml.gz
        run: python build_epg.py --config config.json --out public
      - name: Summary
        if: always()
        run: test -f public/report.md && head -n 40 public/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save report to branch "report"
        if: always()
        run: |
          test -f public/report.md || exit 0
          cd public
          git init -q -b report
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add report.md
          git commit -q -m "report $(date -u +%F_%H%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" report
          rm -rf .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
